# Pangu Omni v2 — portable 8-NPU multimodal SFT template.
#
# Replace /path/to/pangu_omni_v2 with the model directory that contains
# config.json, tokenizer/processor files, and safetensors shards. Replace
# /path/to/multimodal_sft_data with a conversation-format dataset compatible
# with the pangu_mm_sft_v1 data transform.

model:
  model_path: /path/to/pangu_omni_v2
  config_path: /path/to/pangu_omni_v2
  tokenizer_path: /path/to/pangu_omni_v2
  ops_implementation:
    attn_implementation: sdpa
    moe_implementation: fused_npu
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  train_path: /path/to/multimodal_sft_data
  data_type: conversation
  source_name: pangu_mm_sft_v1
  max_seq_len: 1024
  train_size: 1000
  dataloader:
    num_workers: 0
  mm_configs:
    scale_factor: 28
    image_min_pixels: 784
    image_max_pixels: 1605632
    max_ratio: 200
    sample_rate: 16000
    use_audio_in_video: false

train:
  accelerator:
    ulysses_size: 1
    ep_size: 8
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  global_batch_size: 8
  micro_batch_size: 1
  max_steps: 1000
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-6
    lr_decay_style: constant
    max_grad_norm: 1.0
  vit_lr: 1.0e-6
  freeze_vit: false
  freeze_audio_tower: false
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: outputs/pangu_omni_8card_sft
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_omni
    name: pangu_omni_8card_sft
