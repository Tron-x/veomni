# LOCAL SMOKE ONLY: contains local oracle paths and parity-output paths.
# Pangu Omni v2 — 8-NPU REAL 30B-A2B forward-parity (multimodal)
#
# Companion to ``pangu_real_8card.yaml`` (text-only SFT smoke). The
# differences vs that config:
#
#   * model_path / config_path / tokenizer_path point at the real (non
#     text-only-view) directory, so ``architectures=
#     ['OpenPanguUltraOmniForConditionalGeneration']`` is honored and
#     we land on ``OpenPanguOmni`` (= visual + audio_tower + language_model).
#     This is unlocked by the L2b fix (MRoPE × create_causal_mask) on
#     2026-05-22 — see ``modeling_text.py:OpenPanguV2Model.forward``.
#
#   * The vision tower (``model.visual``) and audio tower
#     (``model.audio_tower``) are dense and stay under default FSDP2.
#     Only the routed experts under ``model.language_model.layers.*.
#     mlp.experts.*`` are EP-sharded; ``OpenPanguOmni.get_parallel_plan``
#     handles the ``model.language_model`` FQN prefix automatically.
#
#   * ``train.gradient_checkpointing.enable=false`` — this is forward-only
#     parity (no backward), grad ckpt would only slow things down.
#
# Memory budget per NPU (910B2, 64GB HBM):
#   - Language MoE backbone (~28B bf16) sharded by EP=8 → ~7GB/rank.
#   - Vision tower (~3B bf16) FSDP2-replicated/sharded → ~3GB/rank.
#   - Audio tower (~600M bf16) → ~600MB/rank.
#   - No optimizer state (eval-only forward).
#   - Activations w/o ckpt at seq=512 + bsz=1: ~5-8GB.
#   - Total ~16-20GB/rank → comfortable on 64GB.
#
# Launch (forward parity vs OCRBench HF baseline):
#
#   PARITY_SAMPLES=/mnt/data_3/models/pangu/test_hf_percision.0518.parallel/data/ocrbench.jsonl \
#   PARITY_BASELINE=/mnt/data_3/models/pangu/test_hf_percision.0518.parallel/results/ocrbench_hf_outputs.jsonl \
#   PARITY_OUT=/tmp/pangu_multimodal_parity/report_8card.json \
#   PARITY_TOLERANCE=5e-2 \
#   PARITY_N_SAMPLES=3 \
#   torchrun --nnodes=1 --nproc_per_node=8 --master_port=29512 \
#       veomni/models/transformers/pangu_omni_v2/tools/multi_card_multimodal_parity_runner.py \
#       configs/multimodal/pangu_omni_v2/local_smoke/pangu_real_8card_multimodal.yaml

model:
  # Real Pangu Omni 30B-A2B with the upstream multimodal architectures
  # field intact. Loads ``OpenPanguOmni`` (= visual + audio_tower +
  # language_model + lm_head). Total params ~30B (28B language MoE +
  # 3B vision + 0.6B audio).
  model_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  config_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  tokenizer_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  ops_implementation:
    attn_implementation: sdpa
    # ``fused_npu`` is required for ep_size>1 (see same comment in
    # pangu_real_8card.yaml). Only affects the language MoE — vision /
    # audio towers are dense and don't go through this path.
    moe_implementation: fused_npu
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  # Forward-parity is data-driven by PARITY_SAMPLES (read directly by
  # the runner), but we still need a stub ``data`` block so
  # ``BaseTrainer._setup`` doesn't crash when reading the args. The
  # runner skips _build_dataset/_build_dataloader entirely.
  train_path: tests/toy_data/pangu_toy
  data_type: plaintext
  text_keys: text
  max_seq_len: 512
  train_size: 10000
  dataloader:
    num_workers: 0

train:
  accelerator:
    ulysses_size: 1
    ep_size: 8
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: false
    enable_reentrant: false
  global_batch_size: 8
  micro_batch_size: 1
  max_steps: 5
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-6
    lr_decay_style: constant
    max_grad_norm: 1.0
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: /tmp/pangu_real_8card_multimodal_parity
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_smoke
    name: pangu_real_8card_multimodal
