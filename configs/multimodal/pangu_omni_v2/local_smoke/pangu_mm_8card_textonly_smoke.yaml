# LOCAL SMOKE ONLY: contains local Pangu model paths and short-step limits.
# Minimal text-only smoke through VLMTrainer + OpenPanguOmni.
#
# Goal: confirm a single forward+backward step completes end-to-end on
# the full 30B-A2B model using the VLM data pipeline (with our
# `pangu_mm_sft_v1` preprocessor and the `openpangu_omni` data
# transform). No images / audio — exercises only the language tower
# under the multimodal entry point. Once this is green, we'll dial
# vision and audio back on incrementally.

model:
  model_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  config_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  tokenizer_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  ops_implementation:
    attn_implementation: sdpa
    moe_implementation: fused_npu
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  train_path: tests/toy_data/pangu_mm_toy_text
  data_type: conversation
  source_name: pangu_mm_sft_v1
  max_seq_len: 256
  train_size: 100
  dataloader:
    num_workers: 0
  mm_configs:
    scale_factor: 28
    image_min_pixels: 784
    image_max_pixels: 1605632
    max_ratio: 200
    sample_rate: 16000
    use_audio_in_video: false

train:
  accelerator:
    ulysses_size: 1
    ep_size: 8
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  global_batch_size: 8
  micro_batch_size: 1
  max_steps: 2
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-6
    lr_decay_style: constant
    max_grad_norm: 1.0
  vit_lr: 1.0e-6
  freeze_vit: false
  freeze_audio_tower: false
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: /tmp/pangu_mm_textonly_smoke
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
