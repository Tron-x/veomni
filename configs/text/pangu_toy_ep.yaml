# Pangu Omni v2 — 2-NPU TOY SFT smoke with EP enabled (Plan A.5)
#
# Extends configs/text/pangu_toy.yaml by turning on expert parallelism
# (ep_size=2). With world_size=2 / ep_size=2 / dp_size=1 we exercise the
# EP wiring path (ParallelPlan.apply, DTensor sharding of routed expert
# 3D tensors, FSDP2 wrap-exemption for the experts module, per-rank
# MoE forward), at near-zero cost. Once green, scale to 4+ ranks with
# both ep_size>1 and dp_size>1.
#
# Launch:
#   torchrun --nnodes=1 --nproc_per_node=2 --master_port=29503 \
#     tasks/train_text.py configs/text/pangu_toy_ep.yaml

model:
  config_path: tests/toy_config/pangu_omni_v2_toy
  tokenizer_path: tests/toy_config/pangu_omni_v2_toy
  ops_implementation:
    attn_implementation: sdpa
    moe_implementation: eager
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  train_path: tests/toy_data/pangu_toy
  data_type: plaintext
  text_keys: text
  max_seq_len: 256
  train_size: 10000
  dataloader:
    num_workers: 0

train:
  accelerator:
    ulysses_size: 1
    # EP=2 with world_size=2 means dp_size=1: each rank owns 4 of the 8
    # routed experts (toy n_routed_experts=8). FSDP2 still wraps the
    # non-EP params (embed, lm_head, dense layers, shared_experts), but
    # with shard mesh size 1 those wraps are no-ops — fine for the smoke.
    ep_size: 2
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: false
  # Must be a multiple of micro_batch_size * dp_size. dp_size=1 here so
  # global_batch_size=1 is legal — but that conflicts with EP's all-to-all
  # which expects at least the routed-experts axis to see tokens. The
  # minimal "real" test is global_batch_size=2 so each EP rank sees
  # tokens. Keep at 2 to match plan A's smoke shape.
  global_batch_size: 2
  micro_batch_size: 1
  max_steps: 5
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-3
    lr_decay_style: constant
    max_grad_norm: 1.0
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: /tmp/pangu_toy_ep_sft_out
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_smoke
    name: pangu_toy_ep
