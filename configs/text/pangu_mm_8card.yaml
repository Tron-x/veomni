# Pangu Omni v2 — 8-NPU REAL 30B-A2B multimodal SFT smoke
#
# First real-weight multi-card multimodal training run. Goals:
#   1. Load the full 30B-A2B model (vision + audio + language MoE).
#   2. Run 5 SFT steps on a 14-sample toy corpus that mixes image+text,
#      audio+text, image+audio+text, and text-only samples — exercises
#      both encoder paths and the dummy_forward branch.
#   3. Confirm loss is finite, grads flow through all three submodules,
#      and the per-rank peak VRAM is under 64GB.
#
# Stack exercised (vs ``pangu_real_8card.yaml`` text-only):
#   data (multimodal JSONL) -> processor (image_processor + audio_feature_extractor + tokenizer)
#   -> ``process_sample_openpangu_omni`` (data transform; built on 2026-05-25
#       per veomni/models/transformers/pangu_omni_v2/data_transform.py)
#   -> ``MainCollator`` w/ audio_feature_lengths / input_features / audio_mask collate spec
#   -> ``OpenPanguOmni`` forward (vision tower + audio tower + masked_scatter into LM)
#   -> FSDP2 + EP=8 sharded MoE + dense vision/audio (per-block wrap)
#   -> SDPA + fused_npu MoE + eager everything else
#   -> AdamW + grad clipping + 5 step loop
#
# Launch:
#   torchrun --nnodes=1 --nproc_per_node=8 --master_port=29509 \
#     tasks/train_vlm.py configs/text/pangu_mm_8card.yaml
#
# Memory budget per NPU (910B2, 64GB HBM), rough estimate:
#   - Language MoE backbone (~28B bf16): EP-sharded to ~7GB/rank.
#   - Vision tower (~3B bf16) FSDP2 sharded to ~3GB/rank
#     (per-block wrap from ``_no_split_modules`` fix 2026-05-24).
#   - Audio tower (~600M bf16) FSDP2 sharded to ~600MB/rank.
#   - AdamW fp32 state (master + 2 momenta): ~14GB/rank for language MoE
#     + ~7GB/rank for vision+audio = ~21GB/rank.
#   - Activations: multimodal seq w/ 1 image ~150 tokens + grad ckpt
#     ~5-10GB.
#   - Forward+backward peak: 40-50GB/rank; tight but should fit.

model:
  model_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  config_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  tokenizer_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_hf_model
  ops_implementation:
    attn_implementation: sdpa
    moe_implementation: fused_npu
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  # Multimodal SFT toy corpus (built by
  # ``tests/toy_data/pangu_mm_toy/build_train.py``). 14 samples mixing
  # image+text, audio+text, image+audio+text, and text-only. ``data_type:
  # conversation`` routes through ``VLMTrainer._build_data_transform``
  # to our registered ``openpangu_omni`` transform.
  train_path: tests/toy_data/pangu_mm_toy
  # ``data_type: conversation`` activates the multimodal pipeline. The
  # actual per-sample preprocessor name is ``pangu_mm_sft_v1`` (set via
  # ``data.source_name`` below) — that registers via
  # ``pangu_omni_v2/data_transform.py:pangu_mm_sft_preprocess``.
  data_type: conversation
  source_name: pangu_mm_sft_v1
  max_seq_len: 1024
  train_size: 1000
  dataloader:
    num_workers: 0
  mm_configs:
    # Vision config — Pangu uses spatial_merge_size=2, patch_size=14
    # so 1 patch = 14 px and 1 token = 28 px after merge. Keep
    # min_pixels small so even the 32x32 OCR thumbnails clear the
    # filter, and cap at 1.6M pixels (about 1280×1280) to bound the
    # token count.
    scale_factor: 28
    image_min_pixels: 784  # 1 × 28 × 28
    image_max_pixels: 1605632  # 2048 × 28 × 28
    max_ratio: 200
    # Audio config — Pangu audio extractor expects 16kHz mel
    # spectrogram, audio_merge_size=2 (config.audio_config).
    sample_rate: 16000
    use_audio_in_video: false

train:
  accelerator:
    ulysses_size: 1
    ep_size: 8
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      # NOTE on memory: FSDP2 in veomni does not yet wire up CPU
      # offload (the ``offload: true`` flag is only honored by the
      # FSDP1 init path — see ``distributed/torch_parallelize.py``).
      # Step-1 fits comfortably (54GB peak / 64GB), but after
      # step-1 ``optimizer.step()`` allocates ~16GB of AdamW state
      # the resident memory rises to ~57GB, leaving no headroom
      # for step-2's forward → OOM. This is acceptable for the
      # 1-step smoke; multi-step training needs either FSDP2 CPU
      # offload (upstream work), larger sharding (EP=16 or 2-node
      # cluster), or a lower-memory optimizer (Adafactor).
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  # Grad ckpt MUST be on for full multimodal forward — without it, the
  # 28-layer vision backbone + 24-layer audio backbone + 35-layer
  # language model activations OOM on 64GB HBM at batch=1.
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  global_batch_size: 8
  micro_batch_size: 1
  # Smoke is bounded to 1 step — step-2 OOMs because FSDP2 CPU
  # offload isn't yet wired in veomni and AdamW state (~16GB
  # resident after first step) saturates HBM. Once that's
  # addressed, raise to ``max_steps: 5`` to see loss curve.
  max_steps: 1
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    # Tiny LR — production weights, untuned SFT corpus.
    lr: 1.0e-6
    lr_decay_style: constant
    max_grad_norm: 1.0
  # vit_lr controls the encoder LR if freeze_vit=false; we want all
  # three submodules trained at the same rate for the smoke. (The
  # VLMTrainer optimizer builder splits params by name into two
  # groups: ``visual`` vs other.) Set to the same value so the smoke
  # is independent of the split.
  vit_lr: 1.0e-6
  freeze_vit: false
  freeze_audio_tower: false
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    # Smoke: do NOT save weights — the 30B DCP shard would be GB-scale
    # and waste disk + minutes per step.
    output_dir: /tmp/pangu_mm_8card_smoke
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_smoke
    name: pangu_mm_8card
