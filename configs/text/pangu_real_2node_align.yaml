# Pangu Omni v2 30B-A2B — 2-node 16-NPU "align baseline" config
#
# Twin of ``pangu_real_8card_align.yaml``. Both yamls share the same
# global_batch_size, data path, max_seq_len, dyn_bsz=false, seed and
# optimizer settings — the ONLY difference is the launcher topology
# (2 nodes x 8 NPU here vs 1 node x 8 NPU there).
#
# Why a separate yaml from ``pangu_real_2node.yaml``: the latter was
# designed for the end-to-end OOM-validation smoke (toy corpus,
# dyn_bsz=true, fast). This yaml swaps in c4_test (2000 sample,
# >> global_bsz=16) and disables dyn_bsz so the per-step global sample
# set is identical to the 1-node twin's. Under those conditions, if
# FSDP/EP math is correct, per-step mean-reduced loss agrees with the
# 1-node baseline to within ~1% (residual variance comes from
# cross_entropy_loss's mean-over-tokens being averaged across ranks
# without token-count weighting on variable-length samples).
#
# Topology (same as pangu_real_2node.yaml):
#   - world_size = 16, ep_size = 8, ep_outside = false
#   - EP groups intra-node: [0..7] on master .26, [8..15] on worker .23
#   - EP_FSDP groups cross-node: [0,8], [1,9], ..., [7,15]
#
# Launch (via the forge 2-node coordinator):
#
#   CONFIG=/root/VeOmni/configs/text/pangu_real_2node_align.yaml \
#   ENTRY=/root/VeOmni/tasks/train_text.py \
#   MODEL_DIR=/mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view \
#   DATA_DIR=/root/torchtitan/tests/assets/c4_test \
#   MASTER_ADDR=192.168.0.26 MASTER_PORT=29733 \
#     bash /root/forge/forge/scripts/run_veomni_text_2node_smoke.sh
#
# Pre-conditions (in addition to those listed in pangu_real_2node.yaml
# — transformers>=5.0.0 on both, /etc/hosts cross-resolution):
#   - /root/torchtitan/tests/assets/c4_test/data.json present on BOTH
#     .26 and .23 (verified 2026-05-25 — 2000 lines on each).

model:
  model_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  config_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  tokenizer_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  ops_implementation:
    attn_implementation: sdpa
    moe_implementation: fused_npu
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  train_path: /root/torchtitan/tests/assets/c4_test
  data_type: plaintext
  text_keys: text
  max_seq_len: 512
  train_size: 10000
  dataloader:
    num_workers: 0

train:
  accelerator:
    ulysses_size: 1
    ep_size: 8
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  # Disable dyn_bsz packing — must match the 1-node twin so the per-step
  # global sample set is identical. NOTE: ``dyn_bsz`` lives in the
  # ``train`` dataclass (next to ``micro_batch_size``), not under
  # ``data:`` — putting it under ``data:`` is silently ignored.
  dyn_bsz: false
  # MUST match the 1-node twin (pangu_real_8card_align.yaml). With
  # dp_size=16 the framework derives num_micro_batch=1 (each rank sees
  # 1 sample / step), with dp_size=8 it derives num_micro_batch=2
  # (each rank sees 2 samples / step), but the global 16-sample set
  # per step is the same under matching seed=42.
  global_batch_size: 16
  micro_batch_size: 1
  max_steps: 3
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-6
    lr_decay_style: constant
    max_grad_norm: 1.0
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: /tmp/pangu_real_2node_align
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_align
    name: pangu_real_2node_align
