# Pangu Omni v2 — 2-NPU TOY SFT smoke (Plan A baseline)
#
# Purpose: end-to-end exercise of the VeOmni training pipeline (data ->
# tokenizer -> plaintext transform -> dataloader -> FSDP2 -> optimizer ->
# checkpointer) with a 4-layer / 8-expert Pangu adapter on 2 NPUs of one
# node. Two ranks is the minimum that exercises the real FSDP2 wrap path
# (nproc_per_node=1 silently disables FSDP — and therefore validates
# nothing about Pangu × FSDP2 wrap).
#
# This is NOT a real training run. The model uses random-init weights
# (no `model_path` set) and a 64-sample synthetic dataset; the goal is
# "trainer pipeline does not crash on Pangu adapter" with loss/grad
# sanity at every step. Once green, the same yaml extends naturally to
# full multi-NPU (just bump ``nproc_per_node`` and add an EP plan in
# ``pangu_omni_v2/parallel_plan.py``).
#
# Launch:
#   torchrun --nnodes=1 --nproc_per_node=2 --master_port=29501 \
#     tasks/train_text.py configs/text/pangu_toy.yaml
#
# See `veomni/models/transformers/pangu_omni_v2/README.md` for the
# multi-card / multi-machine scaling path (deepseek_v3 + qwen3_moe
# references).

model:
  # Toy config: 4 layers, hidden=256, 8 routed + 2 shared experts.
  # Pulls tokenizer from the same dir (Pangu's tokenization_sophon_fast
  # symlinked alongside config.json).
  config_path: tests/toy_config/pangu_omni_v2_toy
  tokenizer_path: tests/toy_config/pangu_omni_v2_toy
  # model_path intentionally OMITTED — triggers random init via
  # `init_device=meta` + `empty_init=True` in build_foundation_model.
  # Loading 54GB real weights into a 4-layer toy makes no sense.
  ops_implementation:
    # Pangu modeling is verbatim-ported from upstream and uses standard
    # torch ops; eager paths are correct and what oracle_check.py
    # validates. fused_triton / flash_attention paths haven't been
    # wired for Pangu yet — see _pangu_common/pangu_moe.py for the
    # OpSlot status.
    attn_implementation: sdpa
    moe_implementation: eager
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    # The triton load-balancing-loss kernel is built against mainline
    # triton; triton-ascend on NPU does not provide a compatible build,
    # so pin eager. (See tests/tools/training_utils.py for the same
    # rationale on NPU CI.)
    load_balancing_loss_implementation: eager

data:
  # 64 short Chinese sentences as plaintext samples.
  train_path: tests/toy_data/pangu_toy
  data_type: plaintext
  text_keys: text
  max_seq_len: 256
  # `train_size` is the total token budget for `compute_train_steps`.
  # With 64 samples × avg ~30 tokens ≈ 2000 tokens, but we want enough
  # for max_steps=5 to be reachable.
  train_size: 10000
  dataloader:
    num_workers: 0

train:
  accelerator:
    ulysses_size: 1
    fsdp_config:
      # FSDP2 is the path constraints.md mandates for new code. On
      # single NPU with `nproc_per_node=1` FSDP2 still wraps the model
      # but the shard size is 1 (no-op communication, full state on the
      # single rank). This validates the FSDP2 wrap path on Pangu
      # modules, which is the critical hand-off when we scale up.
      fsdp_mode: fsdp2
      full_shard: true
      offload: false       # see README — fsdp2 offload not implemented in VeOmni today
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: false   # 4-layer toy doesn't need it; keeps backward fast
  # Must be a multiple of micro_batch_size * dp_size. With
  # nproc_per_node=2 / dp_size=2 / micro_batch_size=1 the smallest
  # legal global batch is 2 (= 1 micro batch per rank, no grad
  # accumulation).
  global_batch_size: 2
  micro_batch_size: 1
  max_steps: 5
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-3   # large LR — toy + 5 steps; we want a visible loss drop
    lr_decay_style: constant
    max_grad_norm: 1.0
  # FSDP2 requires init_device='meta' (parallel_init_fsdp_fn shards
  # weights as they materialize off the meta device). This in turn
  # requires fsdp_size > 1 — VeOmni's `fsdp_enabled` is `fsdp_size > 1`,
  # so nproc_per_node=1 short-circuits FSDP, which then rejects meta
  # init. The minimum viable smoke is nproc_per_node=2 (still single
  # node, still cheap, exactly the same FSDP2 wrap code we'll use at
  # scale).
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: /tmp/pangu_toy_sft_out
    manager: dcp
    save_steps: 100   # never triggers in 5 steps — keep the dir clean
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_smoke
    name: pangu_toy_sft
