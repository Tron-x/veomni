# Pangu Omni v2 30B-A2B — 1-node 8-NPU "EP_FSDP isolation" config (exp A)
#
# Purpose: isolate whether the EP_FSDP-size-2 expert-dim sharding is by
# itself sufficient to introduce the ~8.7% step-2 grad_norm drift we
# observed when going from 1-node-8-NPU to 2-node-16-NPU.
#
# Methodology: identical to pangu_real_8card_align.yaml in every respect
# EXCEPT we move from ep=8 (ep_fsdp_size=1) to ep=4 (ep_fsdp_size=2).
#
#   world_size / dp_shard:  8 / 8       (unchanged)
#   sample distribution:    perm[0..15] (unchanged — same seed=42,
#                                          DistributedSampler over 8 ranks,
#                                          num_micro_batch=2 per rank)
#   per-rank input tokens:  unchanged
#   ONLY DIFFERENCE:        ep_size 8->4 ; ep_fsdp_size 1->2
#
# Math comparison vs the existing 8card_align baseline:
#   - dim-0 (experts) is sharded across ep_size ranks:
#       ep=8: each rank holds 384/8 = 48 experts (full dim-1)
#       ep=4: each rank holds 384/4 = 96 experts (DIM-1 also split by
#             ep_fsdp=2, so each rank physically holds 96 * half-dim-1)
#   - down_proj matmul reduction tree:
#       ep_fsdp=1: contiguous bf16 matmul, single reduction order
#       ep_fsdp=2: partial matmul on local half-dim-1, then all-gather +
#                  cross-rank sum -> bf16 ULP perturbations compound
#                  through the same code path as the 2-node 16-NPU run.
#
# Expected outcomes:
#   (A) If step-1 ≈ baseline (ULP-level, ~0.07%) AND step-2 grad_norm
#       diverges by a few % (similar to the 8.7% seen 1node-vs-2node) ->
#       confirms "EP_FSDP=2 splitting alone, not cross-node comms, is the
#       drift source" => the 2-node run is NOT a backward bug; the math
#       behaves the same way under the same EP_FSDP topology on a single
#       node.
#   (B) If step-1 AND step-2 grad_norm both bit-exact-track the
#       ep=8/ep_fsdp=1 baseline -> EP_FSDP splitting is innocent; the
#       drift comes from cross-node reduce paths (FSDP reduce-scatter
#       across 16 vs 8 ranks, or RDMA-mediated all-to-all). That would
#       motivate a closer look at the distributed backward path.
#
# Note on expert count divisibility: Pangu Omni v2 has 384 routed experts
# which is divisible by 4 and 8, so ep_size=4 is a clean reconfiguration.
#
# Launch (single-node, distinct port to avoid clashing with the ep=8
# align run):
#   torchrun --nnodes=1 --nproc_per_node=8 --master_port=29732 \
#     tasks/train_text.py configs/text/pangu_real_8card_align_ep4.yaml

model:
  model_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  config_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  tokenizer_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  ops_implementation:
    attn_implementation: sdpa
    moe_implementation: fused_npu
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  train_path: /root/torchtitan/tests/assets/c4_test
  data_type: plaintext
  text_keys: text
  max_seq_len: 512
  train_size: 10000
  dataloader:
    num_workers: 0

train:
  accelerator:
    ulysses_size: 1
    # Variable under test: ep=4 -> ep_fsdp_size = 8/4 = 2 (matches the
    # cross-node 16-NPU run's ep_fsdp_size). Everything else is fixed.
    ep_size: 4
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  dyn_bsz: false
  global_batch_size: 16
  micro_batch_size: 1
  max_steps: 3
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-6
    lr_decay_style: constant
    max_grad_norm: 1.0
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: /tmp/pangu_real_8card_align_ep4
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_align
    name: pangu_real_8card_align_ep4
