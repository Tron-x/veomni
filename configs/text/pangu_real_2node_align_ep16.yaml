# Pangu Omni v2 30B-A2B — 2-node 16-NPU "EP_FSDP=1 cross-node" config (exp A2_v2)
#
# Purpose: isolate the cross-node-comms effect from the EP_FSDP=2 effect
# in the 1-node vs 2-node grad_norm divergence.
#
# Background. Original align experiment compared:
#   1-node 8NPU ep=8 (ep_fsdp_size = 8/8 = 1)   "A1"
#   2-node 16NPU ep=8 (ep_fsdp_size = 16/8 = 2) "B"
# Step-2 grad_norm differed by ~8% — but two variables changed at once:
#   (i) cross-node FSDP reduce-scatter (group size 8 -> 16)
#   (ii) expert dim-1 splitting (ep_fsdp_size 1 -> 2)
# We can't disentangle (i) and (ii) from those two runs alone.
#
# This yaml provides the missing third point: 2-node 16NPU ep=16, which
# changes (i) but keeps (ii) at 1.
#
#   ep_size = 16  ->  ep_fsdp_size = 16 / 16 = 1
#   Each rank holds 384 / 16 = 24 routed experts with FULL dim-1
#   (no all-gather along the down_proj input dim, same code path as A1).
#
# Reasoning matrix once we have A1 step-2 grad_norm, B step-2 grad_norm,
# and this run (call it B2) step-2 grad_norm:
#
#                              | EP_FSDP=1   | EP_FSDP=2
#   ---------------------------+-------------+-----------
#   1 node  (intra-node only)  | A1 (have)   | OOM (n/a)
#   2 nodes (cross-node)       | B2 (this)   | B (have)
#
#   - If A1 ≈ B2 and B differs significantly => EP_FSDP=2 is the cause
#     (the dim-1 split on down_proj changes the bf16 matmul reduction tree).
#   - If A1 differs from both B2 and B, and B2 ≈ B => cross-node reduce
#     is the cause (FSDP reduce-scatter over 16 vs 8 ranks).
#   - If A1 ≠ B2 ≠ B (all different) => both effects contribute.
#
# Topology details:
#   world_size = 16, ep_size = 16, ep_outside = false
#   - EP groups span BOTH nodes: [0, 1, ..., 15] is one ep group of size 16
#     (each rank holds 24 distinct experts; routing all-to-all sends tokens
#      across node boundary). This is the cost of disabling EP_FSDP — more
#      cross-node all-to-all traffic, but cleaner numerical baseline.
#   - FSDP_EP group: trivial size-1, no cross-rank dim-1 partitioning.
#   - Non-expert FSDP groups: world_size=16 (sharded over both nodes,
#     same as pangu_real_2node_align.yaml).
#
# Memory expectation: at least as good as 2-node align baseline. Expert
# weight per rank is HALVED (24 vs 48 experts) because ep_size doubled,
# and there's no dim-1 dup-replica overhead from ep_fsdp=2. Should fit
# step-2 comfortably (the 1-node A1 already barely fit; 2-node has 2x
# AdamW state distribution).
#
# Launch (via the forge 2-node coordinator):
#
#   CONFIG=/root/VeOmni/configs/text/pangu_real_2node_align_ep16.yaml \
#   ENTRY=/root/VeOmni/tasks/train_text.py \
#   MODEL_DIR=/mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view \
#   DATA_DIR=/root/torchtitan/tests/assets/c4_test \
#   MASTER_ADDR=192.168.0.26 MASTER_PORT=29735 \
#     bash /root/forge/forge/scripts/run_veomni_text_2node_smoke.sh

model:
  model_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  config_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  tokenizer_path: /mnt/data_3/models/pangu/pangu_omini_30ba2_text_only_view
  ops_implementation:
    attn_implementation: sdpa
    moe_implementation: fused_npu
    cross_entropy_loss_implementation: eager
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    load_balancing_loss_implementation: eager

data:
  train_path: /root/torchtitan/tests/assets/c4_test
  data_type: plaintext
  text_keys: text
  max_seq_len: 512
  train_size: 10000
  dataloader:
    num_workers: 0

train:
  accelerator:
    ulysses_size: 1
    # Variable under test: ep_size 8 -> 16 forces ep_fsdp_size from 2 to 1
    # while keeping the 2-node topology (cross-node comms unchanged).
    ep_size: 16
    ep_outside: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      offload: false
      mixed_precision:
        enable: true
    offload_config:
      enable_activation: false
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  dyn_bsz: false
  global_batch_size: 16
  micro_batch_size: 1
  max_steps: 3
  num_train_epochs: 1
  bsz_warmup_ratio: 0
  optimizer:
    type: adamw
    lr: 1.0e-6
    lr_decay_style: constant
    max_grad_norm: 1.0
  init_device: meta
  enable_full_determinism: false
  empty_cache_steps: 500
  seed: 42
  checkpoint:
    output_dir: /tmp/pangu_real_2node_align_ep16
    manager: dcp
    save_steps: 100
    save_epochs: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: pangu_align
    name: pangu_real_2node_align_ep16
